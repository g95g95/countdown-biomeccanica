<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabio è tornato</title>
<meta name="description" content="Fabio è tornato. Gioite del ritorno di Fabio.">
<style>
  :root {
    --green: #00ff41;
    --green-soft: rgba(0, 255, 65, 0.45);
    --mono: ui-monospace, "Cascadia Mono", "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--mono); color: var(--green); }

  #rain { position: fixed; inset: 0; display: block; }

  #panel {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 50vw; height: 50vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 2.5vh;
    padding: 2vh 2vw;
    text-align: center;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid var(--green-soft);
    box-shadow: 0 0 45px rgba(0, 255, 65, 0.25), inset 0 0 40px rgba(0, 255, 65, 0.06);
    backdrop-filter: blur(1.5px);
  }

  .kicker {
    font-size: clamp(0.7rem, 1.1vw, 1.1rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .kicker strong { display: block; margin-top: 0.4em; letter-spacing: 0.2em; font-size: 1.25em; }

  #clock {
    display: flex; align-items: baseline; justify-content: center;
    font-size: clamp(2rem, 6.2vw, 7.5rem);
    font-weight: 700;
    line-height: 1;
    text-shadow: 0 0 14px rgba(0, 255, 65, 0.8), 0 0 34px rgba(0, 255, 65, 0.4);
    font-variant-numeric: tabular-nums;
  }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 1.25em; }
  .unit span { font-size: 0.16em; letter-spacing: 0.3em; font-weight: 400; margin-top: 0.8em; opacity: 0.8; text-shadow: none; }
  .sep { padding: 0 0.12em; opacity: 0.6; animation: blink 1s steps(2, start) infinite; }
  #u-days, #sep-days { display: none; }
  #clock.with-days #u-days, #clock.with-days #sep-days { display: flex; }

  .when { font-size: clamp(0.75rem, 1.2vw, 1.2rem); letter-spacing: 0.15em; opacity: 0.9; }

  #done {
    display: none;
    font-size: clamp(2.2rem, 6vw, 7rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(0, 255, 65, 0.9), 0 0 50px rgba(0, 255, 65, 0.5);
    animation: blink 1.2s steps(2, start) infinite;
  }
  body.done #clock { display: none; }
  body.done #done { display: block; }

  @keyframes blink { to { visibility: hidden; } }

  #qr {
    position: fixed;
    right: 2vmin; bottom: 2vmin;
    display: flex; flex-direction: column; align-items: center; gap: 0.6em;
    padding: 1.1vmin;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid var(--green-soft);
    box-shadow: 0 0 22px rgba(0, 255, 65, 0.22);
    text-decoration: none;
    color: inherit;
  }
  #qr svg { display: block; width: clamp(96px, 12vmin, 168px); height: auto; }
  #qr span {
    font-size: clamp(0.5rem, 0.75vw, 0.72rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  @media (max-width: 760px) {
    #panel { width: 92vw; }
    #clock { font-size: clamp(1.8rem, 11vw, 4rem); }
    #qr svg { width: 88px; }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<main id="panel">
  <p class="kicker">Fabio è tornato.<strong>Gioite del ritorno di Fabio.</strong></p>

  <div id="clock" role="timer">
    <div class="unit" id="u-days"><b id="d">00</b><span>giorni</span></div>
    <div class="sep" id="sep-days">:</div>
    <div class="unit"><b id="h">00</b><span>ore</span></div>
    <div class="sep">:</div>
    <div class="unit"><b id="m">00</b><span>min</span></div>
    <div class="sep">:</div>
    <div class="unit"><b id="s">00</b><span>sec</span></div>
  </div>
  <div id="done">GIOITE!</div>

  <p class="when" id="when">Inverno 2027</p>
</main>

<script>
(function () {
  // Data passata: il countdown resta fermo sullo stato finale e il pannello mostra solo
  // "Inverno 2027" (testo statico in #when). Per riattivarlo basta una data futura, ISO con
  // offset del fuso italiano (CEST +02:00, CET +01:00).
  var TARGET = new Date('2026-09-04T09:30:00+02:00');

  function byId(id) { return document.getElementById(id); }
  var el = { d: byId('d'), h: byId('h'), m: byId('m'), s: byId('s') };
  var clock = byId('clock');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function set(node, txt) { if (node.textContent !== txt) node.textContent = txt; }

  function tick() {
    var diff = TARGET - Date.now();
    if (diff <= 0) { document.body.classList.add('done'); return; }
    var t = Math.floor(diff / 1000);
    var d = Math.floor(t / 86400);
    set(el.d, String(d));
    set(el.h, pad(Math.floor(t % 86400 / 3600)));
    set(el.m, pad(Math.floor(t % 3600 / 60)));
    set(el.s, pad(t % 60));
    clock.classList.toggle('with-days', d > 0);
  }
  tick();
  setInterval(tick, 250);
})();

(function () {
  var WORDS = ['Fabio', 'è', 'tornato.', 'Gioite', 'del', 'ritorno', 'di', 'Fabio.'];
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var W, H, fontSize, laneW, rowH, cols = [], font;

  // ~65% delle volte la frase intera in ordine, altrimenti 1-3 parole sciolte e casuali.
  function makeStream() {
    if (Math.random() < 0.65) return WORDS.slice();
    var n = 1 + Math.floor(Math.random() * 3), out = [];
    for (var i = 0; i < n; i++) out.push(WORDS[Math.floor(Math.random() * WORDS.length)]);
    return out;
  }

  // Le due gocce di una colonna condividono la velocità: la nuova parte sopra l'altra e non la raggiunge mai.
  function makeDrop(startRow) {
    return { row: startRow, words: makeStream(), idx: 0, gap: 0, prev: null };
  }
  function respawn(other) {
    return makeDrop(Math.min(other.row, 0) - (4 + Math.floor(Math.random() * 14)));
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fontSize = Math.max(13, Math.min(20, W / 85));
    font = 'bold ' + fontSize + 'px ' + getComputedStyle(document.body).fontFamily;
    ctx.font = font;
    laneW = ctx.measureText('tornato.').width + fontSize * 0.9;
    rowH = fontSize * 1.4;
    cols = [];
    for (var i = 0, n = Math.ceil(W / laneW) + 1; i < n; i++) {
      var first = makeDrop(-Math.floor(Math.random() * (H / rowH)));
      cols.push({
        x: i * laneW + Math.random() * fontSize * 0.5,
        interval: 65 + Math.random() * 95,
        acc: 0,
        drops: [first, respawn(first)]
      });
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function step(col) {
    for (var k = 0; k < 2; k++) {
      var d = col.drops[k];
      if (d.row < 0) { d.row++; continue; }
      var y = d.row * rowH + fontSize;
      if (y > H + rowH) { col.drops[k] = respawn(col.drops[1 - k]); continue; }

      if (d.gap > 0) {
        d.gap--;
      } else {
        if (d.prev) { ctx.fillStyle = '#00ff41'; ctx.fillText(d.prev.w, col.x, d.prev.y); }
        var w = d.words[d.idx++];
        ctx.fillStyle = '#d9ffe3';
        ctx.fillText(w, col.x, y);
        d.prev = { w: w, y: y };
        if (d.idx >= d.words.length) {
          d.words = makeStream();
          d.idx = 0;
          d.gap = 1 + Math.floor(Math.random() * 4);
        }
      }
      d.row++;
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(now - last, 100);
    last = now;
    // Dissolvenza legata al tempo reale (≈4.5% per frame a 60 fps), stessa scia a qualsiasi frame rate.
    ctx.fillStyle = 'rgba(0, 0, 0, ' + (1 - Math.pow(0.955, dt / 16.67)).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.font = font;
    for (var i = 0; i < cols.length; i++) {
      var col = cols[i];
      col.acc += dt;
      while (col.acc >= col.interval) { col.acc -= col.interval; step(col); }
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
